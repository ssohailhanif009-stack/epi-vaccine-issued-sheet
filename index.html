<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Issued Vaccine Sheet - EPI Civil Hospital Naushahro Feroze</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f4f8;
            color: #1a252c;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 100%;
            width: 100%;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #e1e8ed;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #0f4c81;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #0f4c81;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.3;
        }

        .header h2 {
            color: #2b6cb0;
            font-size: 13px;
            font-weight: 600;
            margin-top: 4px;
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: #f7fafc;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #0f4c81;
        }

        .meta-bar label {
            font-weight: 700;
            color: #2d3748;
            font-size: 13px;
        }

        .date-picker-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .meta-bar input[type="date"] {
            padding: 6px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            color: #2d3748;
            background-color: #ffffff;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 12px;
            min-width: 900px;
        }

        th, td {
            padding: 8px 5px;
            border: 1px solid #cbd5e0;
        }

        thead th {
            background-color: #0f4c81;
            color: #ffffff;
            font-weight: 700;
            white-space: nowrap;
            font-size: 12px;
            letter-spacing: 0.3px;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        tbody td.row-title {
            text-align: left;
            padding-left: 10px;
            font-weight: 700;
            color: #1a202c;
            white-space: nowrap;
            background-color: #edf2f7;
            position: sticky;
            left: 0;
            z-index: 1;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        thead th:first-child {
            position: sticky;
            left: 0;
            z-index: 3;
            background-color: #0c3c66;
        }

        tbody tr.stock-row {
            background-color: #ebf8ff;
        }

        tbody tr.stock-row td.row-title {
            background-color: #bee3f8;
            color: #2b6cb0;
        }

        tbody tr.remaining-row {
            background-color: #f0fff4;
            font-weight: bold;
        }

        tbody tr.remaining-row td.row-title {
            background-color: #c6f6d5;
            color: #22543d;
        }

        input[type="number"] {
            width: 100%;
            min-width: 45px;
            padding: 6px 2px;
            text-align: center;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        input[type="number"]:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.2);
            background-color: #fffaf0;
        }

        .remaining-val {
            font-size: 13px;
            font-weight: 800;
            color: #22543d;
        }

        .remaining-val.warning {
            color: #e53e3e;
        }

        .action-bar {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            width: 100%;
            max-width: 200px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-clear {
            background-color: #e53e3e;
            color: white;
            box-shadow: 0 2px 4px rgba(229, 62, 62, 0.2);
        }

        .btn-clear:hover {
            background-color: #c53030;
        }

        /* Mobile Vertical Responsive View */
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            .container {
                padding: 10px;
                border-radius: 8px;
            }
            .header h1 {
                font-size: 15px;
            }
            .header h2 {
                font-size: 11px;
            }
            .meta-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 8px 10px;
            }
            .action-bar {
                justify-content: center;
            }
            .btn {
                max-width: 100%;
            }

            /* Table Vertical Layout */
            .table-wrapper {
                border: none;
                box-shadow: none;
                overflow-x: visible;
            }

            table, thead, tbody, th, td, tr {
                display: block;
                width: 100% !important;
                min-width: 100% !important;
            }

            thead {
                display: none;
            }

            tbody {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            tbody tr {
                border: 1px solid #cbd5e0;
                border-radius: 8px;
                background-color: #ffffff;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
                overflow: hidden;
            }

            tbody td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 12px;
                text-align: right;
                border: none;
                border-bottom: 1px solid #edf2f7;
            }

            tbody td:last-child {
                border-bottom: none;
            }

            tbody td.row-title {
                position: static;
                width: 100%;
                background-color: #0f4c81 !important;
                color: #ffffff !important;
                font-size: 14px;
                padding: 10px 12px;
                box-shadow: none;
            }

            tbody td::before {
                content: attr(data-label);
                font-weight: 700;
                color: #4a5568;
                text-align: left;
                padding-right: 10px;
                font-size: 12px;
            }

            input[type="number"] {
                width: 90px;
                text-align: right;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DAILY ISSUED VACCINE SHEET</h1>
        <h2>EPI CIVIL HOSPITAL NAUSHAHRO FEROZE</h2>
    </div>

    <div class="meta-bar">
        <div class="date-picker-wrapper">
            <label for="sheet-date">DATE: </label>
            <input type="date" id="sheet-date">
        </div>
        <div style="font-size: 12px; color: #4a5568; font-weight: 600;">
            <span>EPI Stock Management System</span>

    </div>

    <div class="table-wrapper">

            </thead>
            <tbody>
                <!-- Stock Row -->
                <tr class="stock-row">
                    <td class="row-title">STOCK BOOK / REFRIGERATOR</td>
                    <td data-label="BCG"><input type="number" class="stock-input" data-col="0" value="0"></td>
                    <td data-label="HEP-B"><input type="number" class="stock-input" data-col="1" value="0"></td>
                    <td data-label="OPV"><input type="number" class="stock-input" data-col="2" value="0"></td>
                    <td data-label="Penta"><input type="number" class="stock-input" data-col="3" value="0"></td>
                    <td data-label="Panadol"><input type="number" class="stock-input" data-col="4" value="0"></td>
                    <td data-label="PCV-13"><input type="number" class="stock-input" data-col="5" value="0"></td>
                    <td data-label="Rota"><input type="number" class="stock-input" data-col="6" value="0"></td>
                    <td data-label="IPV"><input type="number" class="stock-input" data-col="7" value="0"></td>
                    <td data-label="MR"><input type="number" class="stock-input" data-col="8" value="0"></td>
                    <td data-label="TCV"><input type="number" class="stock-input" data-col="9" value="0"></td>
                    <td data-label="TD"><input type="number" class="stock-input" data-col="10" value="0"></td>
                    <td data-label="HPV"><input type="number" class="stock-input" data-col="11" value="0"></td>
                </tr>

                <!-- Issue Row 1 -->
                <tr>
                    <td class="row-title">FIX-POINT</td>
                    <td data-label="BCG"><input type="number" class="issue-input" data-col="0" value="0"></td>
                    <td data-label="HEP-B"><input type="number" class="issue-input" data-col="1" value="0"></td>
                    <td data-label="OPV"><input type="number" class="issue-input" data-col="2" value="0"></td>
                    <td data-label="Penta"><input type="number" class="issue-input" data-col="3" value="0"></td>
                    <td data-label="Panadol"><input type="number" class="issue-input" data-col="4" value="0"></td>
                    <td data-label="PCV-13"><input type="number" class="issue-input" data-col="5" value="0"></td>
                    <td data-label="Rota"><input type="number" class="issue-input" data-col="6" value="0"></td>
                    <td data-label="IPV"><input type="number" class="issue-input" data-col="7" value="0"></td>
                    <td data-label="MR"><input type="number" class="issue-input" data-col="8" value="0"></td>
                    <td data-label="TCV"><input type="number" class="issue-input" data-col="9" value="0"></td>
                    <td data-label="TD"><input type="number" class="issue-input" data-col="10" value="0"></td>
                    <td data-label="HPV"><input type="number" class="issue-input" data-col="11" value="0"></td>
                </tr>

                <!-- Issue Row 2 -->
                <tr>
                    <td class="row-title">IMRAN ABBASI</td>
                    <td data-label="BCG"><input type="number" class="issue-input" data-col="0" value="0"></td>
                    <td data-label="HEP-B"><input type="number" class="issue-input" data-col="1" value="0"></td>
                    <td data-label="OPV"><input type="number" class="issue-input" data-col="2" value="0"></td>
                    <td data-label="Penta"><input type="number" class="issue-input" data-col="3" value="0"></td>
                    <td data-label="Panadol"><input type="number" class="issue-input" data-col="4" value="0"></td>
                    <td data-label="PCV-13"><input type="number" class="issue-input" data-col="5" value="0"></td>
                    <td data-label="Rota"><input type="number" class="issue-input" data-col="6" value="0"></td>
                    <td data-label="IPV"><input type="number" class="issue-input" data-col="7" value="0"></td>
                    <td data-label="MR"><input type="number" class="issue-input" data-col="8" value="0"></td>
                    <td data-label="TCV"><input type="number" class="issue-input" data-col="9" value="0"></td>
                    <td data-label="TD"><input type="number" class="issue-input" data-col="10" value="0"></td>
                    <td data-label="HPV"><input type="number" class="issue-input" data-col="11" value="0"></td>
                </tr>

                <!-- Issue Row 3 -->
                <tr>
                    <td class="row-title">AIJAZ HUSSAIN MEMON</td>
                    <td data-label="BCG"><input type="number" class="issue-input" data-col="0" value="0"></td>
                    <td data-label="HEP-B"><input type="number" class="issue-input" data-col="1" value="0"></td>
                    <td data-label="OPV"><input type="number" class="issue-input" data-col="2" value="0"></td>
                    <td data-label="Penta"><input type="number" class="issue-input" data-col="3" value="0"></td>
                    <td data-label="Panadol"><input type="number" class="issue-input" data-col="4" value="0"></td>
                    <td data-label="PCV-13"><input type="number" class="issue-input" data-col="5" value="0"></td>
                    <td data-label="Rota"><input type="number" class="issue-input" data-col="6" value="0"></td>
                    <td data-label="IPV"><input type="number" class="issue-input" data-col="7" value="0"></td>
                    <td data-label="MR"><input type="number" class="issue-input" data-col="8" value="0"></td>
                    <td data-label="TCV"><input type="number" class="issue-input" data-col="9" value="0"></td>
                    <td data-label="TD"><input type="number" class="issue-input" data-col="10" value="0"></td>

                <!-- Remaining Balance Row -->
                <tr class="remaining-row">
                    <td class="row-title">REMAINING BALANCE</td>
                    <td data-label="BCG"><span class="remaining-val" data-col="0">0</span></td>
                    <td data-label="HEP-B"><span class="remaining-val" data-col="1">0</span></td>

                    <td data-label="Rota"><span class="remaining-val" data-col="6">0</span></td>
                    <td data-label="IPV"><span class="remaining-val" data-col="7">0</span></td>
                    <td data-label="MR"><span class="remaining-val" data-col="8">0</span></td>

    <div class="action-bar">
        <button class="btn btn-clear" onclick="clearData()">🗑️ Clear All Data</button>
    </div>
</div>

<script>
    const STORAGE_KEY = 'epi_vaccine_sheet_data';

    // Calculate remaining balance for all columns
    function calculateTotals() {
        for (let col = 0; col < 12; col++) {
            const stockInput = document.querySelector(`.stock-input[data-col="${col}"]`);
            const issueInputs = document.querySelectorAll(`.issue-input[data-col="${col}"]`);
            const remainingSpan = document.querySelector(`.remaining-val[data-col="${col}"]`);

            let stockVal = parseFloat(stockInput.value) || 0;
            let totalIssued = 0;

            issueInputs.forEach(input => {
                totalIssued += parseFloat(input.value) || 0;
            });

            let remaining = stockVal - totalIssued;
            remainingSpan.textContent = remaining;

            if (remaining < 0) {
                remainingSpan.classList.add('warning');
            } else {
                remainingSpan.classList.remove('warning');
            }
        }
    }

    // Save inputs to localStorage
    function saveData() {
        const data = {
            date: document.getElementById('sheet-date').value,
            inputs: []
        };

        const allInputs = document.querySelectorAll('table input[type="number"]');
        allInputs.forEach((input) => {
            data.inputs.push(input.value);
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // Load saved data from localStorage
    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.date) {
                    document.getElementById('sheet-date').value = data.date;
                } else {
                    setDefaultDate();
                }

                if (data.inputs && data.inputs.length > 0) {
                    const allInputs = document.querySelectorAll('table input[type="number"]');
                    allInputs.forEach((input, index) => {
                        if (data.inputs[index] !== undefined) {
                            input.value = data.inputs[index];
                        }
                    });
                }
            } catch(e) {
                console.error("Error loading saved data:", e);
                setDefaultDate();
            }
        } else {
            setDefaultDate();
        }

        calculateTotals();
    }

    function setDefaultDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('sheet-date').value = `${yyyy}-${mm}-${dd}`;
    }

    // Clear data & remove permanent LocalStorage
    function clearData() {
        if (confirm("Kya aap waqai tamam values reset karke data local storage se permanent delete karna chahte hain?")) {
            const allInputs = document.querySelectorAll('table input[type="number"]');
            allInputs.forEach(input => {
                input.value = "0";
            });
            
            // Delete from LocalStorage permanently
            localStorage.removeItem(STORAGE_KEY);
            
            setDefaultDate();
            calculateTotals();
        }
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
        loadData();

        const allInputs = document.querySelectorAll('table input[type="number"]');
        allInputs.forEach(input => {
            input.addEventListener('input', () => {
                calculateTotals();
                saveData();
            });
            input.addEventListener('focus', function() {
                if (this.value === "0") {
                    this.value = "";
                }
            });
            input.addEventListener('blur', function() {
                if (this.value === "") {
                    this.value = "0";
                }
                calculateTotals();
                saveData();
            });
        });

        document.getElementById('sheet-date').addEventListener('change', saveData);
    });
</script>

</body>
</html>
